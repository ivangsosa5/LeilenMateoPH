backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/images"
public_folder: "/images"

collections:
  # Gallery Categories
  - name: "galleryCategories"
    label: "Gallery Categories"
    folder: "content/gallery-categories"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Order", name: "order", widget: "number", default: 0}
      - label: "Subcategories"
        name: "subcategories"
        widget: "list"
        fields:
          - {label: "Name", name: "name", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
          - {label: "Order", name: "order", widget: "number", default: 0}
      - label: "Photos"
        name: "photos"
        widget: "list"
        fields:
          - {label: "Image", name: "image", widget: "image"}
          - {label: "Alt Text", name: "alt", widget: "string"}
          - {label: "Caption", name: "caption", widget: "string"}
          - {label: "Subcategory", name: "subcategory", widget: "string"}
          - {label: "Order", name: "order", widget: "number", default: 0}

  # About Page
  - name: "about"
    label: "About Page"
    files:
      - label: "About"
        name: "about"
        file: "content/about.md"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Content", name: "content", widget: "markdown"}
          - {label: "Profile Image", name: "profileImage", widget: "image"}
          - {label: "Experience", name: "experience", widget: "text"}
          - label: "Specialties"
            name: "specialties"
            widget: "list"
            fields:
              - {label: "Specialty", name: "specialty", widget: "string"}

  # Contact Page
  - name: "contact"
    label: "Contact Page"
    files:
      - label: "Contact"
        name: "contact"
        file: "content/contact.md"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Content", name: "content", widget: "markdown"}
          - {label: "WhatsApp Number", name: "whatsappNumber", widget: "string"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Instagram", name: "instagram", widget: "string"}
          - {label: "Address", name: "address", widget: "text"}